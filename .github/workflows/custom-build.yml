# 自建镜像：上游稳定版 + 本分支（custom）的改动提交 → ghcr.io/<owner>/pasarguard-panel:<上游tag>-c<改动版本>
#
# 改动集合 = .custom-base 记录的上游 tag 到 custom 分支 HEAD 之间的提交。
# 每次构建在 CI 工作区里把这组提交 rebase 到目标上游 tag 上（不推回仓库）；冲突则失败并发 TG 通知，
# 需要人工在本地 rebase 后更新 .custom-base 再推送。
# 每个镜像对应一个 Release（同名 tag），附带构建所用的完整源码（AGPL-3.0 对应源码）。
name: custom-build

on:
    schedule:
        - cron: "0 17 * * *" # 北京时间 01:00；服务器 04:00 检查升级
    workflow_dispatch:
        inputs:
            upstream_tag:
                description: "指定上游 tag（留空 = 最新且发布满 72 小时的稳定版）"
                required: false
            force:
                description: "镜像已存在也重新构建"
                type: boolean
                default: false
    push:
        branches: [custom]
        paths-ignore: ["**.md"]

permissions:
    contents: write
    packages: write

concurrency:
    group: custom-build
    cancel-in-progress: false

env:
    UPSTREAM: PasarGuard/panel
    MIN_AGE_HOURS: "72"
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Checkout custom
              uses: actions/checkout@v5
              with:
                  ref: custom
                  fetch-depth: 0

            - name: 选择上游版本
              id: pick
              env:
                  GH_TOKEN: ${{ github.token }}
                  INPUT_TAG: ${{ inputs.upstream_tag }}
                  FORCE: ${{ inputs.force }}
              run: |
                  set -euo pipefail
                  base=$(tr -d '[:space:]' < .custom-base)
                  export BASE="$base"
                  if [ -n "${INPUT_TAG:-}" ]; then
                    target="$INPUT_TAG"
                  else
                    target=$(gh api "repos/$UPSTREAM/releases?per_page=30" | python3 -c '
                  import json, sys, re, datetime as dt, os
                  base = os.environ["BASE"]
                  bmaj = int(re.match(r"v(\d+)", base).group(1))
                  now = dt.datetime.now(dt.timezone.utc)
                  best = None
                  for r in json.load(sys.stdin):
                      m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", r["tag_name"])
                      if not m or r["draft"] or r["prerelease"] or int(m.group(1)) != bmaj:
                          continue
                      age = (now - dt.datetime.fromisoformat(r["published_at"].replace("Z", "+00:00"))).total_seconds() / 3600
                      if age < float(os.environ["MIN_AGE_HOURS"]):
                          continue
                      v = tuple(map(int, m.groups()))
                      if best is None or v > best[0]:
                          best = (v, r["tag_name"])
                  print(best[1] if best else base)
                  ' )
                  fi
                  patch=$(git rev-parse --short=8 HEAD)
                  image_tag="${target}-c${patch}"
                  owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
                  echo "base=$base target=$target image_tag=$image_tag"
                  {
                    echo "base=$base"; echo "target=$target"; echo "patch=$patch"
                    echo "image_tag=$image_tag"; echo "image=ghcr.io/$owner/pasarguard-panel"
                  } >> "$GITHUB_OUTPUT"
                  if gh release view "$image_tag" >/dev/null 2>&1 && [ "${FORCE:-false}" != "true" ]; then
                    echo "skip=true" >> "$GITHUB_OUTPUT"; echo "镜像 $image_tag 已存在，跳过"
                  else
                    echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi
              shell: bash

            - name: 应用改动到目标上游版本（rebase）
              if: steps.pick.outputs.skip == 'false'
              id: rebase
              env:
                  BASE: ${{ steps.pick.outputs.base }}
                  TARGET: ${{ steps.pick.outputs.target }}
              run: |
                  set -euo pipefail
                  git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$BASE:refs/tags/$BASE" "refs/tags/$TARGET:refs/tags/$TARGET"
                  git -c user.name=ci -c user.email=ci@localhost checkout -q -B build custom
                  echo "改动提交："; git log --oneline "$BASE..build"
                  if [ "$BASE" != "$TARGET" ]; then
                    if ! git -c user.name=ci -c user.email=ci@localhost rebase --onto "$TARGET" "$BASE" build; then
                      echo "conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
                      git rebase --abort || true
                      exit 1
                    fi
                    echo "$TARGET" > .custom-base
                  fi
                  git log --oneline -n 6
              shell: bash

            - name: Setup Bun
              if: steps.pick.outputs.skip == 'false'
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: 构建 dashboard
              if: steps.pick.outputs.skip == 'false'
              run: |
                  set -euo pipefail
                  (cd dashboard && bun install --frozen-lockfile)
                  ./build_dashboard.sh
                  cmp dashboard/public/statics/locales/zh.json dashboard/build/statics/locales/zh.json
                  echo "zh.json 已进入构建产物"

            - name: 基本检查
              if: steps.pick.outputs.skip == 'false'
              run: |
                  set -euo pipefail
                  python3 -m py_compile app/subscription/singbox.py app/jobs/ip_limit.py
                  test -f app/jobs/ip_limit_assets/ip_limit_ui.js

            - name: Set up Docker Buildx
              if: steps.pick.outputs.skip == 'false'
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              if: steps.pick.outputs.skip == 'false'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ github.token }}

            - name: 构建并推送镜像（amd64）
              if: steps.pick.outputs.skip == 'false'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ steps.pick.outputs.image }}:${{ steps.pick.outputs.image_tag }}
                      ${{ steps.pick.outputs.image }}:latest
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.description=PasarGuard panel ${{ steps.pick.outputs.target }} + custom patches ${{ steps.pick.outputs.patch }}
                      org.opencontainers.image.licenses=AGPL-3.0
                      org.opencontainers.image.version=${{ steps.pick.outputs.image_tag }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: 镜像冒烟测试
              if: steps.pick.outputs.skip == 'false'
              env:
                  IMG: ${{ steps.pick.outputs.image }}:${{ steps.pick.outputs.image_tag }}
              run: |
                  set -euo pipefail
                  docker run --rm --entrypoint python "$IMG" -c "
                  import pathlib, json
                  assert pathlib.Path('/code/app/jobs/ip_limit_assets/ip_limit_ui.js').is_file()
                  json.load(open('/code/dashboard/build/statics/locales/zh.json'))
                  import ast; ast.parse(open('/code/app/subscription/singbox.py').read())
                  print('ok')"

            - name: 发布 Release（含对应源码）
              if: steps.pick.outputs.skip == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ steps.pick.outputs.image_tag }}
                  TARGET: ${{ steps.pick.outputs.target }}
                  IMAGE: ${{ steps.pick.outputs.image }}
              run: |
                  set -euo pipefail
                  git archive --format=tar.gz --prefix="pasarguard-panel-$TAG/" -o "source-$TAG.tar.gz" HEAD
                  notes=$(printf '上游 %s + 自定义改动 %s\n\n镜像：`%s:%s`\n\n改动提交：\n%s\n\n<!-- meta {"upstream":"%s","image":"%s:%s"} -->' \
                    "$TARGET" "${{ steps.pick.outputs.patch }}" "$IMAGE" "$TAG" "$(git log --format='- %s' "$TARGET..HEAD")" "$TARGET" "$IMAGE" "$TAG")
                  gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
                  gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --notes "$notes" "source-$TAG.tar.gz"

            - name: 失败通知
              if: failure()
              env:
                  TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
                  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
                  TARGET: ${{ steps.pick.outputs.target }}
                  CONFLICTS: ${{ steps.rebase.outputs.conflicts }}
              run: |
                  [ -n "${TG_BOT_TOKEN:-}" ] || exit 0
                  msg="❌ PasarGuard 自建镜像构建失败（上游 ${TARGET:-?}）"
                  [ -n "${CONFLICTS:-}" ] && msg="$msg
                  改动与上游冲突：$CONFLICTS
                  需人工 rebase custom 分支并更新 .custom-base"
                  msg="$msg
                  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  curl -s -o /dev/null --data-urlencode "chat_id=$TG_CHAT_ID" --data-urlencode "text=$msg" \
                    "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage"
